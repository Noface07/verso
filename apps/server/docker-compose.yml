services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: reader
      POSTGRES_USER: reader
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reader -d reader"]
      interval: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://reader:${DB_PASSWORD}@db:5432/reader
      JWT_SECRET: ${JWT_SECRET}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      FILES_DIR: /data/files
      MAX_FILE_MB: ${MAX_FILE_MB:-300}
    volumes:
      - files:/data/files
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-ffxasce.duckdns.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    restart: unless-stopped
    environment:
      SUBDOMAINS: ${DUCKDNS_SUBDOMAINS:-ffxasce}
      TOKEN: ${DUCKDNS_TOKEN:-}
      LOG_FILE: "false"

volumes:
  pgdata:
  files:
  caddy_data:
  caddy_config: