[package]
name = "verso"
version = "0.1.0"
description = "Verso eBook & Manga Reader"
authors = ["Verso Team"]
edition = "2021"

[lib]
name = "verso_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-os = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"

# Desktop-only plugins (they don't build for Android/iOS).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

# Dependencies (rustls, reqwest, image decoding) are very slow when unoptimised,
# and every native HTTP request in `tauri dev` goes through them. Optimise deps in
# dev while keeping the app crate itself fast to rebuild.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
panic = "abort"
strip = true
